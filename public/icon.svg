<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#082322" />
      <stop offset="50%" stop-color="#051014" />
      <stop offset="100%" stop-color="#020508" />
    </radialGradient>

    <!-- Outer Rim Metallic Sheen -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2b0" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#14b8a6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0df5e3" stop-opacity="0.6" />
    </linearGradient>

    <!-- Primary Logo Vector Gradient (Cyber Mint to Electric Cyan) -->
    <linearGradient id="primaryVector" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#00f2b0" />
      <stop offset="60%" stop-color="#0df5e3" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Right Wing Vector Gradient -->
    <linearGradient id="secondaryVector" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Core Glow Flare -->
    <radialGradient id="coreFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00f2b0" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0df5e3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="url(#coreFlare)" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Geometric Interlocking "T" & "V" Prism (ToolVerse) -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Crossbar of "T" (Faceted Cyber Beam) -->
    <path 
      d="M136 148 C136 140 142 136 150 136 L362 136 C370 136 376 140 376 148 L356 192 C353 198 346 202 338 202 L174 202 C166 202 159 198 156 192 Z" 
      fill="url(#primaryVector)" 
    />

    <!-- Left Wing of the "V" (Descending Prism Blade) -->
    <path 
      d="M152 220 L212 360 C216 370 226 376 236 376 L256 376 L204 220 Z" 
      fill="url(#primaryVector)" 
    />

    <!-- Right Wing of the "V" (Converging Blade) -->
    <path 
      d="M360 220 L300 360 C296 370 286 376 276 376 L256 376 L308 220 Z" 
      fill="url(#secondaryVector)" 
    />

    <!-- Central Vertical Stem of "T" Connecting to Vertex -->
    <path 
      d="M236 190 L276 190 L266 330 C265 336 261 340 256 340 C251 340 247 336 246 330 Z" 
      fill="url(#primaryVector)" 
      opacity="0.95"
    />

    <!-- Dynamic Bottom Chevron Tip -->
    <path 
      d="M232 376 L256 416 C258 420 262 420 264 416 L288 376 Z" 
      fill="#00f2b0" 
    />
  </g>

  <!-- Central 4-Point AI Nova Sparkle (Intelligence Core) -->
  <g transform="translate(256, 256)">
    <!-- Horizontal Lens Spoke -->
    <ellipse cx="0" cy="0" rx="42" ry="4.5" fill="#ffffff" />
    <!-- Vertical Lens Spoke -->
    <ellipse cx="0" cy="0" rx="4.5" ry="42" fill="#ffffff" />
    <!-- Diagonal Subtle Glow -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
    <circle cx="0" cy="0" r="7" fill="#0df5e3" />
  </g>

  <!-- Specular Top Rim Highlight (Luxury Glass Feel) -->
  <path 
    d="M60 70 Q256 35 452 70" 
    stroke="#ffffff" 
    stroke-width="2.5" 
    stroke-linecap="round" 
    opacity="0.3" 
    fill="none" 
  />
</svg>
