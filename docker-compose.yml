version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: korevante-studio-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-korevante_db}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-korevante-production-secret-replace-me-with-32-chars}
      - AUTH_SECRET=${AUTH_SECRET:-korevante-production-secret-replace-me-with-32-chars}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/app/public/uploads
    networks:
      - korevante-network

  postgres:
    image: postgres:16-alpine
    container_name: korevante-studio-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-korevante_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-korevante_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - korevante-network

volumes:
  pgdata:
    driver: local
  app_uploads:
    driver: local

networks:
  korevante-network:
    driver: bridge
